<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="css/navbar.css">
	<link rel="stylesheet" href="css/root.css">
	<link rel="stylesheet" href="css/broadcast.css">
</head>

<body>
	<div id="navbar">
		<a class="navbutton activebutton"><img src="img/broadcast.png"></a>
		<a class="navbutton" onclick="checkBroadcastStatus('settings.html')"><img src="img/gear.png"></a>
		<a class="navbutton" onclick="checkBroadcastStatus('stats.html')"><img src="img/Stats.png"></a>
	</div>
	<div id="broadcastContainer">
		<h2>Broadcast Dashboard</h2>
		<div id="dashboardContainer">
			<div class="dashboardItem">
				<button id="startPauseBroadcast" onclick="startBroadcast()">Start</button>
				<button id="stopBroadcast" onclick="stopBroadcast()">Stop</button>
			</div>
			<div class="dashboardItem">
				<h5 id="onlineCounter">Online: 00:00:00</h5>
				<h5 id="endCounter">Until end: 00:00:00</h5>
				<canvas id="visual" width="300" height="100"></canvas>
			</div>
			<div class="dashboardItem">
				<h3 id="broadcastStatus">Press START to begin broadcast</h3>
				<h5 id="serverPing">Ping: 999ms</h5>
				<h5 id="bitrate">Bitrate: 44100hz</h5>
				<h5 id="dataCounter">Data sent: 0mb</h5>
			</div>
			<div class="dashboardItem">
				<h5 id="listenerCounter">0 Listeners</h5>
			</div>
		</div>
	</div>
	<script src="js/helper.js"></script>
	<script src="js/broadcast.js"></script>
</body>

</html>
