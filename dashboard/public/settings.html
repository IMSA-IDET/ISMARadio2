<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/settings.css">
  </head>
  <body>
    <div id="navbar">
      <a  class="navbutton activebutton"><img src="img/gear.png"></a>
      <a class="navbutton"><img src="img/broadcast.png"></a>
      <a class="navbutton"><img src="img/Stats.png"></a>
    </div>
    <div id="settingsContainer">
      <h2>Settings</h2>
      <div class="setting">
        <h6>Host/IP</h6>
        <input type="text" id="HostSet" placeholder="Hostname">
        <h6>Port</h6>
        <input type="text" id="PostSet" placeholder="Port">
        <h6>Broadcast Password</h6>
        <input type="password" id="PasswordSet" placeholder="Broadcast Password">
        <input type="button" id="apply" value="Apply Changes">
      </div>
    </div>
  </body>
</html>
