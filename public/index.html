<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="img/whitecontrastlogo.png">
    <title>ISMA Radio - Broadcast</title>
</head>

<body>
    <div id="topnav">
        <a href="/" id="logoA"><img src="img/whitecontrastlogo.png" id="logo"></a>
        <a href="/schedule" class="navlink">Schedule</a>
        <a href="/episodes" class="navlink">Past Episodes</a>
        <a href="/contact" class="navlink">Contact</a>
    </div>
    <div id="topnavPadding"></div>
    <div id="centerContainer">
        <div id="currentPlayingDetails" class="centerItem">
            <h3>Currently Playing: <div id="currentName"></div></h3>
            <div id="playingMiddleDivs">
                <img id="albumcover"
                    src="/img/blank.png"
                    alt="">
                <div id="Schedule">
                    <h3>Schedule</h3>
                    <div></div>
                </div>
            </div>
            <div id="playingBottomDivs">
                <div id="description">
                    <h3>Description</h3>
                    <p></p>
                </div>
            </div>
        </div>
        <div id="upcomingScheduleContainer" class="centerItem">
            <div id="nextTitle">Coming Up Next</div>
            <div id="nextContainer"></div>
        </div>
        <div id="chatContainer" class="centerItem">
            <div id="chatTopBar">
                <div id="chatSettingButton">
                    <object data="img/settings_icon.svg" id="chatsettingbutton"></object>
                </div>
                <div id="chatTitle">Live Chat</div>
            </div>
            <div id="chat"></div>
            <div id="chatSendContainer">
                <input id="chatInput" type="text" placeholder="Send a message..." maxlength="50">
                <div id="chatSendButton">
                    <!--<button id="msgsend"></button>-->
                    <object id="msgsendImage" data="img/send_icon.svg"></object>
                    <div id="msgsend"></div>
                </div>
            </div>
        </div>
    </div>
    <div id=bottomControlPanel>
        <div id="volumeContainer">
            <object data="img/volume_icon.svg" id="volicon"> </object>
            <input type="range" id="volcontrol">
        </div>
        <div id="MediaControl">
            <object id="playButtonImage" data="img/play_icon.svg"></object>
            <object id="pauseButtonImage" data="img/pause_icon.svg"></object>
            <div id="playButton"></div>
            <div id="visual">
                <canvas id="visualCanvas" width="300" height="100"></canvas>
                <div id="streamStatus">Start radio stream</div>
                <div id="streamStart">00:00:00</div>
            </div>
        </div>
        <div id="connections">
            <h5 id="conCount">0</h5>
            <object data="img/listener_icon.svg"> </object>
        </div>
    </div>
    <script src="js/wsHandler.js"></script>
    <script src="js/conversion.js"></script>
    <script src="js/visual.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/volume.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/info.js"></script>
    <script src="js/listenersCount.js"></script>
</body>

</html>
