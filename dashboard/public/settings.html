<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="css/navbar.css">
	<link rel="stylesheet" href="css/root.css">
	<link rel="stylesheet" href="css/settings.css">
</head>

<body>
	<div id="navbar">
		<a class="navbutton" href="broadcast.html"><img src="img/broadcast.png"></a>
		<a class="navbutton activebutton"><img src="img/gear.png"></a>
		<a class="navbutton" href="stats.html"><img src="img/Stats.png"></a>
	</div>
	<div id="settingsContainer">
		<h2>Settings</h2>
		<h3 id="currentShow">Connecting to server...</h3>
		<div class="setting">
			<h6>Host/IP</h6>
			<input type="text" id="HostSet" placeholder="Hostname">
			<h6>Port</h6>
			<input type="text" id="PortSet" placeholder="Port">
			<h6>Broadcast Password</h6>
			<input type="password" id="PasswordSet" placeholder="Broadcast Password">
			<h6>Microphone ID</h6>
			<input type="number" id="MicrophoneSet" placeholder="Number ID">
			<h6>Recording File Name</h6>
			<input type="text" id="RecordingSet" placeholder="File Name">
			<h6>Volume Multiplier</h6>
			<input type="number" id="VolumeSet" placeholder="Multiplier">
			<button id="apply" onclick="applySettings()">Apply Changes</button>
		</div>
	</div>
	<script src="js/helper.js"></script>
	<script src="js/settings.js"></script>
</body>

</html>
